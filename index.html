<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Espaço Pessoal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="app-header">
        <div class="header-logo">
            <h1><i class="fa-solid fa-moon"></i> Meu Espaço</h1>
            <p id="current-date"></p>
        </div>
        
        <div class="music-player">
            <span class="player-title"><i class="fa-solid fa-music"></i> Som de Fundo:</span>
            <select id="ambient-music">
                <option value="">Nenhum (Silêncio)</option>
                <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">Lo-Fi Relaxante (Exemplo 1)</option>
                <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">Chuva Ambient (Exemplo 2)</option>
                <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3">Foco Synthwave (Exemplo 3)</option>
            </select>
            <button id="btn-play-music" class="btn-icon"><i class="fa-solid fa-play"></i></button>
            <audio id="bg-audio" loop></audio>
        </div>
    </header>

    <main class="dashboard-container">
        
        <section class="dash-column">
            <h2><i class="fa-solid fa-clock"></i> Horários do Dia</h2>
            <form id="form-compromisso" class="quick-form">
                <input type="time" id="comp-hora" required>
                <input type="text" id="comp-titulo" placeholder="Novo compromisso..." required>
                <button type="submit"><i class="fa-solid fa-plus"></i></button>
            </form>
            <div id="lista-compromissos" class="list-container"></div>
        </section>

        <section class="dash-column">
            <h2><i class="fa-solid fa-list-check"></i> Tarefas & Hábitos</h2>
            <form id="form-tarefa" class="quick-form">
                <input type="text" id="tarefa-texto" placeholder="O que precisa ser feito?" required>
                <button type="submit"><i class="fa-solid fa-plus"></i></button>
            </form>
            <div id="lista-tarefas" class="list-container"></div>
        </section>

        <section class="dash-column dynamic-column">
            <div class="sub-block">
                <h2><i class="fa-solid fa-book-open"></i> Diário Pessoal</h2>
                <p class="subtitle">Como foi o seu dia? (Salva automático)</p>
                <textarea id="diary-input" placeholder="Querido diário, hoje eu foquei em..."></textarea>
                <div id="diary-status" class="status-info">Salvo localmente</div>
            </div>
            
            <hr class="separator">

            <div class="sub-block flex-grow">
                <h2><i class="fa-solid fa-note-sticky"></i> Insights & Notas Rápidas</h2>
                <textarea id="scratchpad" placeholder="Ideias soltas, links, rascunhos..."></textarea>
                <div id="scratch-status" class="status-info">Salvo localmente</div>
            </div>
        </section>

    </main>

    <script src="main.js"></script>
</body>
</html>
